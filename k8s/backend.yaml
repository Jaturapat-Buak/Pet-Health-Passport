apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uploads
  namespace: pet-health-passport
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: standard
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: pet-health-passport
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 5000
      targetPort: http
