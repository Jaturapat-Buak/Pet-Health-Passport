apiVersion: v1
kind: ServiceAccount
metadata:
  name: php-traefik
  namespace: pet-health-passport
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: php-traefik
rules:
  - apiGroups: [""]
    resources: ["nodes", "services", "endpoints", "secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingressclasses", "ingresses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses/status"]
    verbs: ["update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: php-traefik
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: php-traefik
subjects:
  - kind: ServiceAccount
    name: php-traefik
    namespace: pet-health-passport
---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: php-traefik
spec:
  controller: traefik.io/ingress-controller
---
apiVersion: v1
kind: Service
metadata:
  name: php-traefik
  namespace: pet-health-passport
spec:
  type: NodePort
  selector:
    app: php-traefik
  ports:
    - name: web
      port: 80
      targetPort: web
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: php-traefik
  namespace: pet-health-passport
spec:
  replicas: 1
  selector:
    matchLabels:
      app: php-traefik
  template:
    metadata:
      labels:
        app: php-traefik
    spec:
      serviceAccountName: php-traefik
      containers:
        - name: traefik
          image: traefik:v3.7.14
          args:
            - --entrypoints.web.address=:8000
            - --entrypoints.traefik.address=:9000
            - --providers.kubernetesingress=true
            - --providers.kubernetesingress.namespaces=pet-health-passport
            - --providers.kubernetesingress.ingressclass=php-traefik
            - --ping=true
          ports:
            - name: web
              containerPort: 8000
            - name: ping
              containerPort: 9000
          readinessProbe:
            httpGet:
              path: /ping
              port: ping
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /ping
              port: ping
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pet-health-passport
  namespace: pet-health-passport
spec:
  ingressClassName: php-traefik
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 5000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
